[project]
name = "tldr-linebot"
version = "0.1.0"
description = "LINE group chat TL;DR bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "line-bot-sdk>=3.26.0",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tldr-linebot = "tldr_linebot.app:main"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF003"]  # line length is left to the formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
